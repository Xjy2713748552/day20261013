<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex1</title>
    <style>
        body{
            margin: 0;
            padding: 0;
        }

        .box{
            width: 250px;
            height: 150px;
            background-color: black;
            color: red;

            display: flex;
            /* 开启flex弹性布局 */
            justify-content: center;
            /* 垂直居中 */
            align-items: center;
            /* 水平居中 */
        }
    </style>
</head>
<body>
    <div class="box">
        <p>hello world</p>
    </div>
</body>
</html>
